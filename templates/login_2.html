<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Biblioteca Escolar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            color: #2563eb;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            margin: 20px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            background: #2563eb;
            color: white;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            background: #1d4ed8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="pantallaLogin" class="container">
        <h1>📚 Biblioteca Escolar</h1>
        <p class="subtitle">Iniciar Sesión</p>
        
        <form action="/login" method="post" id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input placeholder="Ingresa usuario" name="usuario"  type="text" id="usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input placeholder="Ingresa contraseña"  name="password" type="password" id="password" required>
            </div>
            
            <button type="submit" class="btn-login">
                Ingresar al Sistema
            </button>
        </form>
    </div>

    <p>{{value}}</p>

    <script>
    </script>
</body>
</html>
